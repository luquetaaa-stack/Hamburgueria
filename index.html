<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="/imgs/logo.png">
    
    <title>Smash House</title>
</head>
<body>
    <header>
        <img class="logoSemFundo" src="imgs/logoSemFundo.png" alt="SmashHouseLogo">

        <div class="headerContainer">
            <h3>Unidades</h3>
            <h3>Cardápio</h3>
            <h3>Delivery</h3>
            <h3>Fale conosco</h3>
            
            <div class="lang-selector" id="langSelector">
                <img src="https://flagcdn.com/w20/br.png" alt="Brasil" id="currentFlag">
                <span id="currentLang">PT</span>
                <i class="arrow"></i>
        
                <div class="lang-dropdown">
                    <div class="lang-option active" data-lang="pt">
                    <img src="/icons/brasil.png" alt="Português">
                    <span>Português</span>
                </div>
            
                <div class="lang-option" data-lang="en">
                  <img src="/icons/estados-unidos.png" alt="English">
                  <span>English</span>
                </div>
            </div>
        </div>
    </header>

    <main></main>

    <div class="divisor"></div>

    <footer></footer>

    <script src="/js/script.js"></script>
</body>
</html>
